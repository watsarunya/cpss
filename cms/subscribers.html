<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subscribers — CP B&amp;F CMS</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="cms-shell">
  <aside class="cms-sidebar">
    <div class="cms-sidebar__logo">
      <img src="../raw/assets/cpss-logo-transparent.png" alt="CPSS" />
      <button type="button" class="cms-sidebar__toggle" id="cmsSidebarToggle" aria-label="ย่อ/ขยายเมนู">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="cms-nav">
      <a href="index.html" class="cms-nav__item">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="cms-nav__label">จัดการเมนู</span>
      </a>
      <a href="banners.html" class="cms-nav__item">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="5" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="m3 13 5-4 4 3 5-5 4 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 20h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">จัดการแบนเนอร์</span>
      </a>
      <div class="cms-nav__group-label">Newsroom</div>
      <a href="news-articles.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 8h10M7 12h10M7 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">รายการบทความ</span>
      </a>
      <a href="news-categories.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        <span class="cms-nav__label">หมวดหมู่</span>
      </a>
      <div class="cms-nav__group-label">เพจ</div>
      <a href="pages.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">รายการเพจ</span>
      </a>
      <div class="cms-nav__group-label">คลังอะไหล่</div>
      <a href="spare-parts.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">Spare Parts</span>
      </a>
      <div class="cms-nav__group-label">ระบบ</div>
      <a href="admins.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">จัดการแอดมิน</span>
      </a>
    </nav>
  </aside>

  <div class="cms-main">
    <header class="cms-topbar">
      <div class="cms-topbar__right">
        <div class="cms-avatar-menu">
          <button type="button" class="cms-avatar" id="cmsAvatarBtn" aria-haspopup="true" aria-expanded="false">
            <span class="cms-avatar__circle" id="cmsUserInitial">?</span>
            <span class="cms-avatar__email" id="cmsUserEmail">...</span>
          </button>
          <div class="cms-avatar-menu__dropdown" id="cmsAvatarDropdown">
            <button type="button" class="cms-avatar-menu__item" id="cmsLogoutBtn">
              <span class="cms-nav__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="cms-content">
      <p class="cms-breadcrumb">CMS / <strong>Subscribe</strong></p>

      <div class="cms-stats">
        <div class="cms-stat-card">
          <p class="cms-stat-card__label">Total Subscribers</p>
          <div class="cms-stat-card__value"><span id="statTotalSubscribers">–</span></div>
        </div>
      </div>

      <div class="cms-panel">
        <div class="cms-toolbar">
          <span class="cms-toolbar__label">รายชื่อผู้สมัครรับข่าวสาร</span>
          <div class="cms-toolbar__right">
            <div class="cms-search">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input type="search" id="subscriberSearchInput" placeholder="ค้นหาอีเมล..." />
            </div>
            <button type="button" class="cms-btn" id="exportSubscribersBtn">
              <span aria-hidden="true">⬇️</span> Export Excel
            </button>
          </div>
        </div>

        <div class="cms-table-wrap">
          <table class="cms-menu-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>วันที่</th>
                <th>เวลา</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="subscriberTableBody">
              <!-- rendered by subscribers.js -->
            </tbody>
          </table>
        </div>
        <div class="cms-empty" id="subscriberEmptyState" hidden>ยังไม่มีผู้สมัครรับข่าวสาร</div>
      </div>
    </main>
  </div>
</div>

<div class="cms-toast" id="cmsToastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="subscribers.js"></script>
</body>
</html>
